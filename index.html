<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>菠萝快跑</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #7ec8f2; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  #game { display: block; width: 100%; height: 100%; touch-action: none; }

  /* 顶部 HUD */
  #hud {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 16px; pointer-events: none; z-index: 5;
    color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,.35);
  }
  .hud-box { background: rgba(0,0,0,.28); border-radius: 14px; padding: 6px 14px; font-size: 18px; font-weight: 700; }
  #hearts { letter-spacing: 2px; }

  /* 遮罩层 */
  .overlay {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(20, 40, 60, .55); color: #fff; text-align: center; padding: 20px;
  }
  .overlay.hidden { display: none; }
  .title { font-size: 46px; font-weight: 900; letter-spacing: 4px; margin-bottom: 10px;
    text-shadow: 0 4px 0 #2e7d32, 0 8px 12px rgba(0,0,0,.4); }
  .subtitle { font-size: 18px; margin-bottom: 24px; opacity: .95; }
  .btn {
    pointer-events: auto; cursor: pointer; border: none; outline: none;
    background: linear-gradient(#ffd54f, #ff9800); color: #5d3a00;
    font-size: 22px; font-weight: 800; padding: 14px 44px; border-radius: 30px;
    box-shadow: 0 6px 0 #c77700, 0 10px 16px rgba(0,0,0,.35);
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #c77700; }
  .tips { margin-top: 22px; font-size: 15px; line-height: 1.9; opacity: .9; }
  .final-score { font-size: 26px; margin: 10px 0; }
  .best { font-size: 18px; color: #ffe082; margin-bottom: 20px; }

  /* 触屏按钮 */
  #touch { position: fixed; left: 0; right: 0; bottom: 18px; z-index: 6; display: flex;
    justify-content: space-between; padding: 0 18px; pointer-events: none; }
  .tgroup { display: flex; gap: 12px; }
  .tbtn {
    pointer-events: auto; width: 62px; height: 62px; border-radius: 50%;
    background: rgba(255,255,255,.25); border: 2px solid rgba(255,255,255,.5);
    color: #fff; font-size: 26px; font-weight: 800; display: flex; align-items: center; justify-content: center;
  }
  .tbtn:active { background: rgba(255,255,255,.45); }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div class="hud-box">分数 <span id="score">0</span></div>
  <div class="hud-box">🍍 <span id="pine">0</span></div>
  <div class="hud-box" id="hearts">❤️❤️❤️</div>
</div>

<div id="touch">
  <div class="tgroup">
    <div class="tbtn" id="btnLeft">◀</div>
    <div class="tbtn" id="btnRight">▶</div>
  </div>
  <div class="tgroup">
    <div class="tbtn" id="btnSlide">▼</div>
    <div class="tbtn" id="btnJump">▲</div>
  </div>
</div>

<div id="startOverlay" class="overlay">
  <div class="title">🍍 菠萝快跑</div>
  <div class="subtitle">带着菠萝头的男孩，一路狂奔，躲开障碍，收集菠萝！</div>
  <button class="btn" id="startBtn">开始游戏</button>
  <div class="tips">
    键盘：← → 换道　↑ / 空格 跳跃　↓ 下滑<br>
    手机：左右滑动换道，上滑跳跃，下滑钻行；也可点下方按钮
  </div>
</div>

<div id="overOverlay" class="overlay hidden">
  <div class="title" style="font-size:38px;">游戏结束</div>
  <div class="final-score">本局分数：<span id="finalScore">0</span></div>
  <div class="best">最高分：<span id="bestScore">0</span></div>
  <button class="btn" id="restartBtn">再来一局</button>
</div>

<script>
(function () {
  "use strict";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  let W = 0, H = 0;

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + "px"; canvas.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  // ---------- 常量与状态 ----------
  const MAX_Z = 100;
  const PLAYER_Z = 8;

  const STATE = { READY: 0, RUNNING: 1, OVER: 2 };
  let state = STATE.READY;

  let player, obstacles, coins, particles;
  let score, pineCount, lives, speed, elapsed, spawnTimer, coinTimer;
  let best = parseInt(localStorage.getItem("boloBest") || "0", 10);

  const scoreEl = document.getElementById("score");
  const pineEl = document.getElementById("pine");
  const heartsEl = document.getElementById("hearts");
  const startOverlay = document.getElementById("startOverlay");
  const overOverlay = document.getElementById("overOverlay");
  const finalScoreEl = document.getElementById("finalScore");
  const bestScoreEl = document.getElementById("bestScore");

  function reset() {
    player = {
      lane: 1, x: 0,          // x 为车道插值位置
      y: 0, vy: 0,            // 跳跃高度与速度
      jumping: false,
      sliding: false, slideT: 0,
      inv: 0,                 // 无敌时间
      runPhase: 0
    };
    obstacles = [];
    coins = [];
    particles = [];
    score = 0; pineCount = 0; lives = 3;
    speed = 18; elapsed = 0;
    spawnTimer = 0; coinTimer = 0;
    updateHud();
  }

  function updateHud() {
    scoreEl.textContent = Math.floor(score);
    pineEl.textContent = pineCount;
    heartsEl.textContent = "❤️".repeat(Math.max(0, lives)) + "🖤".repeat(Math.max(0, 3 - lives));
  }

  // ---------- 透视投影 ----------
  function horizonY() { return H * 0.34; }
  function scaleOf(z) { return 1 - z / MAX_Z; }
  function groundY(z) { return horizonY() + (H * 0.94 - horizonY()) * scaleOf(z); }
  function laneX(lane, z) {
    const offset = lane - 1; // 索引 0/1/2 映射到 -1/0/1
    const near = W * 0.21;
    return W / 2 + offset * near * scaleOf(z);
  }

  // ---------- 生成 ----------
  function spawnObstacle() {
    // 随机一条或两条车道放障碍，保证至少一条可通行
    const laneCount = Math.random() < 0.35 ? 2 : 1;
    const shuffled = [0, 1, 2].sort(() => Math.random() - 0.5);
    const type = Math.random() < 0.55 ? "block" : "overhead"; // block需跳，overhead需滑
    for (let i = 0; i < laneCount; i++) {
      obstacles.push({ lane: shuffled[i], z: MAX_Z, type, hit: false });
    }
  }

  function spawnCoinRow() {
    const lane = Math.floor(Math.random() * 3);
    for (let i = 0; i < 4; i++) {
      coins.push({ lane, z: MAX_Z + i * 9, collected: false });
    }
  }

  // ---------- 输入 ----------
  function moveLane(dir) {
    if (state !== STATE.RUNNING) return;
    const next = player.lane + dir;
    if (next >= 0 && next <= 2) player.lane = next;
  }
  function jump() {
    if (state !== STATE.RUNNING) return;
    if (!player.jumping) {
      player.jumping = true;
      player.vy = 15.5;
      player.sliding = false; player.slideT = 0;
    }
  }
  function slide() {
    if (state !== STATE.RUNNING) return;
    player.sliding = true; player.slideT = 0.65;
    if (player.jumping) { // 空中下滑：快速落地
      player.vy = Math.min(player.vy, -12);
    }
  }

  window.addEventListener("keydown", (e) => {
    if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", " "].includes(e.key)) e.preventDefault();
    if (e.key === "ArrowLeft") moveLane(-1);
    else if (e.key === "ArrowRight") moveLane(1);
    else if (e.key === "ArrowUp" || e.key === " ") jump();
    else if (e.key === "ArrowDown") slide();
  });

  function bindBtn(id, fn) {
    const el = document.getElementById(id);
    const handler = (e) => { e.preventDefault(); fn(); };
    el.addEventListener("pointerdown", handler);
    el.addEventListener("mousedown", handler);
  }
  bindBtn("btnLeft", () => moveLane(-1));
  bindBtn("btnRight", () => moveLane(1));
  bindBtn("btnJump", jump);
  bindBtn("btnSlide", slide);

  // 触屏滑动
  let touchStart = null;
  canvas.addEventListener("touchstart", (e) => {
    const t = e.changedTouches[0];
    touchStart = { x: t.clientX, y: t.clientY };
  }, { passive: true });
  canvas.addEventListener("touchend", (e) => {
    if (!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x, dy = t.clientY - touchStart.y;
    touchStart = null;
    if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) moveLane(dx > 0 ? 1 : -1);
    else if (dy < 0) jump();
    else slide();
  }, { passive: true });

  // ---------- 更新 ----------
  function hurt() {
    if (player.inv > 0) return;
    lives--;
    player.inv = 1.4;
    updateHud();
    burst(laneX(player.lane, PLAYER_Z), groundY(PLAYER_Z), "#ff5252");
    if (lives <= 0) gameOver();
  }

  function burst(x, y, color) {
    for (let i = 0; i < 14; i++) {
      particles.push({
        x, y,
        vx: (Math.random() - 0.5) * 5,
        vy: (Math.random() - 0.8) * 5,
        life: 0.6, color
      });
    }
  }

  function gameOver() {
    state = STATE.OVER;
    if (Math.floor(score) > best) {
      best = Math.floor(score);
      localStorage.setItem("boloBest", String(best));
    }
    finalScoreEl.textContent = Math.floor(score);
    bestScoreEl.textContent = best;
    overOverlay.classList.remove("hidden");
  }

  function update(dt) {
    elapsed += dt;
    // 速度随时间提升（起步更慢，留出反应时间）
    speed = Math.min(36, 15 + elapsed * 0.38);
    score += dt * speed * 0.35;

    // 玩家车道插值
    const targetX = player.lane;
    player.x += (targetX - player.x) * Math.min(1, dt * 12);

    // 跳跃物理
    if (player.jumping) {
      player.y += player.vy;
      player.vy -= 0.72;
      if (player.y <= 0) { player.y = 0; player.jumping = false; player.vy = 0; }
    }
    if (player.sliding) {
      player.slideT -= dt;
      if (player.slideT <= 0) player.sliding = false;
    }
    if (player.inv > 0) player.inv -= dt;
    player.runPhase += dt * speed * 0.12;

    // 生成节奏随速度加快
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnObstacle();
      spawnTimer = Math.max(0.85, 1.7 - elapsed * 0.012);
    }
    coinTimer -= dt;
    if (coinTimer <= 0) { spawnCoinRow(); coinTimer = 2.4; }

    // 障碍移动与碰撞
    for (const ob of obstacles) {
      ob.z -= speed * dt;
      if (ob.hit) continue;
      if (Math.abs(ob.z - PLAYER_Z) < 3.5) {
        if (Math.round(player.x) === ob.lane) {
          let safe = false;
          if (ob.type === "block") safe = player.jumping && player.y > 8;
          else if (ob.type === "overhead") safe = player.sliding;
          if (!safe) { ob.hit = true; hurt(); }
        }
      }
    }
    obstacles = obstacles.filter(o => o.z > -10);

    // 金币移动与收集
    for (const c of coins) {
      c.z -= speed * dt;
      if (c.collected) continue;
      if (Math.abs(c.z - PLAYER_Z) < 6 && Math.round(player.x) === c.lane) {
        c.collected = true; pineCount++; score += 10;
        updateHud();
        burst(laneX(c.lane, PLAYER_Z), groundY(PLAYER_Z) - 30, "#ffca28");
      }
    }
    coins = coins.filter(c => c.z > -10 && !c.collected);

    scoreEl.textContent = Math.floor(score);

    // 粒子
    for (const p of particles) {
      p.x += p.vx; p.y += p.vy; p.vy += 0.25; p.life -= dt;
    }
    particles = particles.filter(p => p.life > 0);
  }

  // ---------- 绘制 ----------
  function drawBackground() {
    // 天空
    const sky = ctx.createLinearGradient(0, 0, 0, horizonY());
    sky.addColorStop(0, "#6ec6f5");
    sky.addColorStop(1, "#bde7fb");
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, horizonY() + 2);

    // 太阳
    ctx.fillStyle = "#fff3b0";
    ctx.beginPath(); ctx.arc(W * 0.82, H * 0.12, 34, 0, Math.PI * 2); ctx.fill();

    // 云
    ctx.fillStyle = "rgba(255,255,255,.85)";
    drawCloud(W * 0.2, H * 0.12, 1);
    drawCloud(W * 0.5, H * 0.2, 0.8);

    // 地面
    const g = ctx.createLinearGradient(0, horizonY(), 0, H);
    g.addColorStop(0, "#8bc34a");
    g.addColorStop(1, "#558b2f");
    ctx.fillStyle = g;
    ctx.fillRect(0, horizonY(), W, H - horizonY());

    // 跑道（三条浅色带）
    for (const lane of [0, 1, 2]) {
      const xNear = laneX(lane, 0), xFar = laneX(lane, MAX_Z);
      const yNear = groundY(0), yFar = groundY(MAX_Z);
      ctx.fillStyle = "rgba(222,184,135,.55)";
      ctx.beginPath();
      const wNear = W * 0.085, wFar = W * 0.012;
      ctx.moveTo(xNear - wNear, yNear);
      ctx.lineTo(xNear + wNear, yNear);
      ctx.lineTo(xFar + wFar, yFar);
      ctx.lineTo(xFar - wFar, yFar);
      ctx.closePath(); ctx.fill();
    }

    // 车道分隔线
    ctx.strokeStyle = "rgba(255,255,255,.5)";
    ctx.lineWidth = 2;
    for (const b of [-0.5, 0.5]) {
      ctx.beginPath();
      ctx.moveTo(W / 2 + b * W * 0.21, groundY(0));
      ctx.lineTo(W / 2 + b * W * 0.21 * scaleOf(MAX_Z), groundY(MAX_Z));
      ctx.stroke();
    }

    // 路边棕榈树（远处重复）
    for (let i = 0; i < 5; i++) {
      const z = (i * 22 + (elapsed * speed * 0.4) % 22) % MAX_Z;
      const sideX = (side) => W / 2 + side * W * 0.28 * scaleOf(z);
      drawPalm(sideX(-1), groundY(z), scaleOf(z));
      drawPalm(sideX(1), groundY(z), scaleOf(z));
    }
  }

  function drawCloud(x, y, s) {
    ctx.beginPath();
    ctx.arc(x, y, 18 * s, 0, Math.PI * 2);
    ctx.arc(x + 20 * s, y + 4 * s, 14 * s, 0, Math.PI * 2);
    ctx.arc(x - 20 * s, y + 5 * s, 13 * s, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawPalm(x, y, s) {
    ctx.save();
    ctx.translate(x, y); ctx.scale(s, s);
    ctx.strokeStyle = "#795548"; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(6, -46); ctx.stroke();
    ctx.fillStyle = "#2e7d32";
    for (let a = 0; a < 5; a++) {
      const ang = -Math.PI / 2 + (a - 2) * 0.5;
      ctx.beginPath();
      ctx.ellipse(6 + Math.cos(ang) * 16, -46 + Math.sin(ang) * 10, 16, 6, ang, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawCoin(c) {
    const s = scaleOf(c.z);
    const x = laneX(c.lane, c.z);
    const y = groundY(c.z) - 26 * s;
    const r = 13 * s;
    if (r < 2) return;
    ctx.save();
    ctx.translate(x, y);
    // 菠萝造型金币
    ctx.fillStyle = "#ffca28";
    ctx.beginPath(); ctx.ellipse(0, 0, r * 0.8, r, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#e68a00"; ctx.lineWidth = 1.5 * s;
    ctx.beginPath(); ctx.ellipse(0, 0, r * 0.8, r, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = "#43a047";
    ctx.beginPath();
    ctx.moveTo(0, -r); ctx.lineTo(-r * 0.4, -r * 1.5); ctx.lineTo(0, -r * 1.2);
    ctx.lineTo(r * 0.4, -r * 1.5); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function drawObstacle(ob) {
    const s = scaleOf(ob.z);
    const x = laneX(ob.lane, ob.z);
    const y = groundY(ob.z);
    const w = W * 0.13 * s, h = 46 * s;
    const near = ob.z < 30;          // 很近：脉冲提示
    const warn = ob.z < 55;         // 进入可反应距离：地面警示条

    // 地面阴影（增强前后距离感）
    ctx.save();
    ctx.fillStyle = "rgba(0,0,0,.28)";
    ctx.beginPath();
    ctx.ellipse(x, y, w * 1.05, 9 * s, 0, 0, Math.PI * 2);
    ctx.fill();

    // 地面车道警示条：提前标出所在车道与远近
    if (warn) {
      const pulse = near ? 0.55 + 0.25 * Math.sin(elapsed * 9) : 0.4;
      ctx.globalAlpha = pulse;
      ctx.fillStyle = ob.type === "block" ? "#ffb300" : "#42a5f5";
      roundRect(x - w * 0.7, y - 6 * s, w * 1.4, 12 * s, 5 * s);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.restore();

    ctx.save();
    ctx.translate(x, y);
    if (ob.type === "block") {
      // 木箱路障（需跳跃），高度调矮便于越过
      const bh = 34 * s;
      ctx.fillStyle = "#8d6e63";
      ctx.fillRect(-w / 2, -bh, w, bh);
      ctx.strokeStyle = "#4e342e"; ctx.lineWidth = 2.5 * s;
      ctx.strokeRect(-w / 2, -bh, w, bh);
      ctx.beginPath();
      ctx.moveTo(-w / 2, -bh); ctx.lineTo(w / 2, 0);
      ctx.moveTo(w / 2, -bh); ctx.lineTo(-w / 2, 0);
      ctx.stroke();
      // 警示条纹
      ctx.fillStyle = "#ffb300";
      ctx.fillRect(-w / 2, -bh * 0.55, w, bh * 0.25);
    } else {
      // 悬挂横杆（需下滑）
      ctx.strokeStyle = "#9e9e9e"; ctx.lineWidth = 3 * s;
      ctx.beginPath(); ctx.moveTo(-w / 2, -h * 2.2); ctx.lineTo(-w / 2, -h * 1.1); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(w / 2, -h * 2.2); ctx.lineTo(w / 2, -h * 1.1); ctx.stroke();
      ctx.fillStyle = "#ef5350";
      ctx.fillRect(-w / 2, -h * 1.25, w, h * 0.35);
      ctx.fillStyle = "#fff";
      for (let i = -1; i <= 1; i++) {
        ctx.fillRect(i * w * 0.25 - w * 0.05, -h * 1.25, w * 0.1, h * 0.35);
      }
    }

    // 接近时动作提示：↑跳 / ↓滑
    if (ob.z < 45) {
      const fs = Math.max(12, 19 * s);
      ctx.font = `800 ${fs}px sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "bottom";
      const label = ob.type === "block" ? "↑ 跳" : "↓ 滑";
      const tipY = ob.type === "block" ? -h - 6 * s : -h * 2.2 - 6 * s;
      ctx.lineWidth = 3 * s;
      ctx.strokeStyle = "rgba(255,255,255,.9)";
      ctx.strokeText(label, 0, tipY);
      ctx.fillStyle = ob.type === "block" ? "#e65100" : "#01579b";
      ctx.fillText(label, 0, tipY);
    }
    ctx.restore();
  }

  // 菠萝头男孩
  function drawPlayer() {
    const s = scaleOf(PLAYER_Z);
    const x = laneX(player.x, PLAYER_Z);
    const y = groundY(PLAYER_Z) - player.y;
    const blink = player.inv > 0 && Math.floor(elapsed * 12) % 2 === 0;
    if (blink) ctx.globalAlpha = 0.4;

    ctx.save();
    ctx.translate(x, y);
    const slide = player.sliding;
    const bodyH = slide ? 0.6 : 1;

    // 阴影
    ctx.fillStyle = "rgba(0,0,0,.25)";
    ctx.beginPath();
    ctx.ellipse(0, 2, 26 * s, 8 * s, 0, 0, Math.PI * 2);
    ctx.fill();

    // 腿（跑步摆动）
    ctx.strokeStyle = "#37474f"; ctx.lineWidth = 7 * s; ctx.lineCap = "round";
    const legSwing = Math.sin(player.runPhase) * 10 * s;
    if (!player.jumping) {
      ctx.beginPath(); ctx.moveTo(-6 * s, -18 * s); ctx.lineTo(-6 * s + legSwing, 0); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(6 * s, -18 * s); ctx.lineTo(6 * s - legSwing, 0); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.moveTo(-6 * s, -18 * s); ctx.lineTo(-12 * s, -8 * s); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(6 * s, -18 * s); ctx.lineTo(12 * s, -10 * s); ctx.stroke();
    }

    // 身体（T恤）
    ctx.fillStyle = "#29b6f6";
    roundRect(-16 * s, (-46 * bodyH) * s, 32 * s, 30 * bodyH * s, 8 * s);
    ctx.fill();

    // 手臂
    ctx.strokeStyle = "#ffcc80"; ctx.lineWidth = 6 * s;
    const armSwing = Math.sin(player.runPhase + Math.PI) * 8 * s;
    ctx.beginPath(); ctx.moveTo(-14 * s, -38 * s); ctx.lineTo(-20 * s, -26 * s + armSwing); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(14 * s, -38 * s); ctx.lineTo(20 * s, -26 * s - armSwing); ctx.stroke();

    // 菠萝头
    const headY = slide ? -52 * s : -66 * s;
    const hr = 18 * s;
    // 叶冠
    ctx.fillStyle = "#2e7d32";
    for (let i = -2; i <= 2; i++) {
      ctx.beginPath();
      ctx.ellipse(i * 6 * s, headY - hr * 0.8, 5 * s, 12 * s, i * 0.25, 0, Math.PI * 2);
      ctx.fill();
    }
    // 菠萝果身（头）
    ctx.fillStyle = "#ffb300";
    ctx.beginPath(); ctx.ellipse(0, headY, hr * 0.85, hr, 0, 0, Math.PI * 2); ctx.fill();
    // 菱形纹路
    ctx.strokeStyle = "#e68a00"; ctx.lineWidth = 1.2 * s;
    for (let i = -2; i <= 2; i++) {
      ctx.beginPath(); ctx.moveTo(-hr, headY + i * 6 * s); ctx.lineTo(hr, headY + i * 6 * s + 4 * s); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(hr, headY + i * 6 * s); ctx.lineTo(-hr, headY + i * 6 * s + 4 * s); ctx.stroke();
    }
    // 脸
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(-6 * s, headY - 2 * s, 3.2 * s, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(6 * s, headY - 2 * s, 3.2 * s, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#212121";
    ctx.beginPath(); ctx.arc(-6 * s, headY - 2 * s, 1.6 * s, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(6 * s, headY - 2 * s, 1.6 * s, 0, Math.PI * 2); ctx.fill();
    // 嘴
    ctx.strokeStyle = "#5d4037"; ctx.lineWidth = 1.6 * s;
    ctx.beginPath(); ctx.arc(0, headY + 5 * s, 5 * s, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();

    ctx.restore();
    ctx.globalAlpha = 1;
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawParticles() {
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / 0.6);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function render() {
    drawBackground();
    // 按 z 从远到近绘制
    const list = [];
    for (const o of obstacles) list.push({ z: o.z, kind: "ob", obj: o });
    for (const c of coins) list.push({ z: c.z, kind: "coin", obj: c });
    list.sort((a, b) => b.z - a.z);
    for (const it of list) {
      if (it.kind === "ob") drawObstacle(it.obj); else drawCoin(it.obj);
    }
    if (state !== STATE.READY) drawPlayer();
    drawParticles();
  }

  // ---------- 主循环 ----------
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (state === STATE.RUNNING) update(dt);
    render();
    requestAnimationFrame(loop);
  }

  function startGame() {
    reset();
    state = STATE.RUNNING;
    startOverlay.classList.add("hidden");
    overOverlay.classList.add("hidden");
  }

  document.getElementById("startBtn").addEventListener("click", startGame);
  document.getElementById("restartBtn").addEventListener("click", startGame);

  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
